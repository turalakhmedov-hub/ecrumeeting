<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e28"><title>ECRU — Save the Christmas</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#f5f7ef;background:#0d2924}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#28634c 0,transparent 34%),linear-gradient(160deg,#123d32,#09241f 72%)}main{max-width:600px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;letter-spacing:2px;font-weight:900;font-size:22px}.tag{font-size:10px;letter-spacing:1.4px;color:#d9edcf;border:1px solid #668b73;border-radius:30px;padding:7px 10px}.hero{padding:32px 0 16px}.eyebrow{font-size:11px;letter-spacing:2px;color:#c3e7ba;font-weight:800}h1{font-size:clamp(36px,9vw,58px);line-height:.97;margin:15px 0;letter-spacing:-1.7px}h2{font-size:29px;line-height:1.12;margin:12px 0}p{line-height:1.55;color:#d4e4d7}.ornaments{font-size:36px;letter-spacing:12px;margin:15px 0}.panel{background:#f7f7ed;color:#15382e;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 15px 40px #001a143b}.panel p{color:#4d6258}.panel h2{color:#123b30}.btn{display:block;width:100%;border:0;border-radius:13px;background:#d3f26e;color:#153428;font-size:16px;font-weight:900;padding:17px;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:#e6f6dd;border:1px solid #7fa38c}.input{width:100%;padding:15px;font-size:16px;border:1px solid #bdcfc0;border-radius:12px;background:white;color:#173c30}.muted{font-size:12px;color:#adc8b6}.progress{display:flex;gap:5px;margin:22px 0}.progress span{height:7px;border-radius:9px;background:#3b6657;flex:1}.progress span.on{background:#d5f36e}.mission{font-size:12px;color:#bbdbb4;font-weight:800;letter-spacing:1.6px}.scenario{padding:15px;background:#eaf0e4;border-radius:12px;color:#234637;line-height:1.5}.option{width:100%;text-align:left;background:white;border:2px solid #d5dfd1;color:#173b30;border-radius:13px;padding:15px 14px;margin-top:10px;font-size:15px;line-height:1.35;cursor:pointer}.option.chosen{border-color:#23845f;background:#d9efdc}.option:disabled{cursor:default}.feedback{margin-top:15px;padding:14px;border-radius:12px;background:#e0f1dc;color:#224e35;line-height:1.45}.score{font-size:60px;font-weight:900;line-height:1;color:#164e3b}.smallcaps{font-size:11px;letter-spacing:1.4px;font-weight:900;color:#5b7c65}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #dbe4d9}.footer{text-align:center;font-size:11px;color:#a2c4ad;margin-top:28px}.hide{display:none}.spark{color:#d9f16f} .choice-label{display:inline-block;min-width:24px;font-weight:900;color:#348363}@media(prefers-reduced-motion:no-preference){.panel{animation:rise .3s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.7}to{transform:none;opacity:1}}} .timerwrap{margin:13px 0;background:#33594a;border-radius:12px;height:11px;overflow:hidden}.timerbar{height:100%;width:100%;background:#d3f26e;transition:width .2s linear}.timertext{font-size:13px;font-weight:800;color:#d3f26e}.warning{color:#ffb78a}.consequence{margin-top:12px;padding:12px;border-radius:12px;background:#fff0d4;color:#65441b;line-height:1.4}.pill{display:inline-block;background:#d3f26e;color:#143c30;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900} 
/* V4: 3D store scene and dynamic simulation indicators */
.storemap{position:relative;border:1px solid #638b76;border-radius:18px;overflow:hidden;margin:16px 0;background:#172d29;box-shadow:0 14px 32px #001a1455}.storemap img{width:100%;height:auto;display:block}.maptop{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.mapchip{font-size:10px;font-weight:900;letter-spacing:.3px;background:#0c211ee8;color:#e5ffce;border:1px solid #9bcb8c;padding:7px 9px;border-radius:12px;box-shadow:0 2px 10px #0008}.mapbottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.meter{background:#173e34;border:1px solid #4b806b;border-radius:12px;padding:9px 7px;min-width:0}.meter .metertitle{font-size:10px;color:#d8e8d9;white-space:nowrap}.meter .pct{font-size:16px;font-weight:900;margin-top:4px}.metertrack{height:6px;border-radius:8px;background:#416253;overflow:hidden;margin-top:6px}.meterfill{height:100%;background:#c8ef6b;transition:width .35s ease}.meterfill.low{background:#ff9b69}.mapnote{font-size:12px;color:#d8e9d7;margin:8px 2px 0;line-height:1.4}.mapwarning{color:#ffd39c}.mapbadge{position:absolute;left:6%;top:29%;font-size:10px;background:#341d19eb;border:1px solid #ff986d;color:#fff3e7;padding:7px 9px;border-radius:9px;font-weight:800;max-width:43%;box-shadow:0 4px 12px #0008}.mapbadge.good{background:#153b2fe8;border-color:#b1f482}.v4title{font-size:11px;letter-spacing:1.5px;color:#d3f26e;font-weight:900;margin-top:18px}.mapwrap{margin-bottom:15px}@media(max-width:390px){.mapchip{font-size:9px;padding:5px 7px}.meter{padding:7px 5px}.meter .metertitle{font-size:9px}.meter .pct{font-size:14px}}
</style></head><body><main><header class="top"><span>ECRU<span class="spark">✳</span></span><span class="tag">OPERATIONS 2026</span></header><div id="app"></div><div class="footer">ECRU MANAGERS ANNUAL MEETING · V4.0</div></main><script>
const missions=[
{label:'01 / ПРАЗДНИЧНЫЙ ХАОС',title:'48 часов до Нового года',scene:'В зале пустеют рейлы, поставка ждёт разбора. Команда постоянно спрашивает директора, что делать.',q:'Твой первый шаг?',opts:[['Взять все решения на себя',8,'Быстро сегодня, но завтра команда снова будет ждать директора.'],['Назначить приоритеты, ответственных и точки контроля',20,'Ты создал основу управляемой смены.'],['Попросить всех ускориться',3,'Скорость без организации усиливает хаос.']]},
{label:'02 / ПОПОЛНЕНИЕ',title:'Товар есть. Продажи уходят.',scene:'Отчёт по пополнению показывает пропуски. Товар на складе, а в торговом зале пустые места.',q:'Что изменишь?',opts:[['Напоминания в чат каждые 30 минут',6,'Напоминания не заменяют стандарт.'],['Контроль лично директором',9,'Работает, пока директор рядом.'],['Интервалы, роли, критерии проверки и действия при сбое',20,'Процесс стал понятным и воспроизводимым.']]},
{label:'03 / РАЗБОР ПОСТАВКИ',title:'Коробки против команды',scene:'Сотрудники работают усердно, но товары перемещаются по складу несколько раз, а поставка не разобрана.',q:'Как убрать потери времени?',opts:[['Передать всё самому быстрому сотруднику',8,'Появилось узкое место.'],['Подготовить зоны, разделить этапы и ответственность',20,'Ты изменил организацию, а не просто темп.'],['Назначить жёсткий дедлайн',4,'Дедлайн не исправляет хаотичный маршрут товара.']]},
{label:'04 / ИНВЕНТАРИЗАЦИЯ',title:'Остатки не сходятся',scene:'После инвентаризации обнаружены расхождения. В команде спорят, кто ошибся при пересчёте.',q:'Что сделаешь?',opts:[['Удлинить следующую инвентаризацию',8,'Пересчёт может помочь, но причины могут остаться.'],['Самостоятельно перепроверить все позиции',4,'Это не масштабируется.'],['Исследовать причины и ежедневное движение товара',20,'Контроль встроен в ежедневный процесс.']]}];
const events=[
{after:0,headline:'⚡ НЕОЖИДАННО: СТАРШИЙ СМЕНЫ ЗАБОЛЕЛ',desc:'До открытия осталось 40 минут. Именно он обычно распределяет задачи. Команда ждёт указаний.',q:'Твой экстренный выбор?',opts:[['Отменить часть задач и управлять всем самому',4,'Смена спасена частично, но зависимость от одного человека сохранилась.'],['Передать смену по заранее определённым ролям и чек-листу',10,'Процесс выдержал отсутствие ключевого сотрудника.'],['Попросить сотрудников самим разобраться',1,'Без правил ответственность становится размытой.']]},
{after:2,headline:'🎁 СЮРПРИЗ: ДОПОЛНИТЕЛЬНАЯ ПОСТАВКА',desc:'За час до пика приехала внеплановая поставка. В разгрузочной зоне уже тесно.',q:'Как действуешь?',opts:[['Разгружать всё сразу, чтобы быстрее освободить машину',3,'Создаётся перегрузка зоны и лишние перемещения.'],['Остановить все остальные процессы',4,'Решение слишком дорого для магазина.'],['Применить приоритеты, лимит загрузки зоны и распределение ролей',10,'Команда адаптировала процесс к отклонению без хаоса.']]}];

function health(){
 let stock=75,floor=77,team=76;
 const a=state.answers,e=state.events;
 if(a[0]){if(a[0].choice===1){team+=12;floor+=7}else{team-=14;floor-=8}}
 if(a[1]){if(a[1].choice===2){floor+=17;team+=4}else{floor-=15}}
 if(a[2]){if(a[2].choice===1){stock+=20;team+=5}else{stock-=22;team-=8}}
 if(a[3]){if(a[3].choice===2){stock+=8;floor+=6}else{stock-=9}}
 if(e[0]){if(e[0].choice===1){team+=8}else{team-=15;floor-=5}}
 if(e[1]){if(e[1].choice===2){stock+=8;team+=5}else{stock-=18;team-=7}}
 return [stock,floor,team].map(v=>Math.max(10,Math.min(100,v)));
}
function mapMarkup(){
 const [stock,floor,team]=health(),overall=Math.round((stock+floor+team)/3);
 const note=overall>=85?'Команда работает по понятным правилам — магазин устойчив к сбоям.':overall>=65?'Магазин справляется, но некоторые процессы ещё уязвимы.':'Ручное управление перегружает команду. Риск сбоев растёт.';
 const badges=stock<65?'<span class="mapbadge">⚠ СКЛАД ПЕРЕГРУЖЕН</span>':stock>=85?'<span class="mapbadge good">✓ ПОСТАВКА ПОД КОНТРОЛЕМ</span>':'';
 return `<div class="mapwrap"><div class="v4title">3D-КАРТА · СОСТОЯНИЕ МАГАЗИНА</div><div class="storemap"><img src="store.webp" alt="Изометрическая игровая карта магазина ECRU со складом, торговым залом и кассами">${badges}<div class="maptop"><span class="mapchip">🎄 ECRU STORE</span><span class="mapchip">${overall>=80?'● СТАБИЛЬНО':overall>=60?'● ВНИМАНИЕ':'● КРИЗИС'}</span></div></div><div class="mapbottom">${[['📦 СКЛАД',stock],['👕 ЗАЛ',floor],['👥 КОМАНДА',team]].map(([name,val])=>`<div class="meter"><div class="metertitle">${name}</div><div class="pct">${val}%</div><div class="metertrack"><div class="meterfill ${val<65?'low':''}" style="width:${val}%"></div></div></div>`).join('')}</div><p class="mapnote ${overall<65?'mapwarning':''}">${note}</p></div>`;
}

let clock=null, deadline=0, timeLimit=30, currentKey='';
let state={screen:'welcome',name:'',index:0,answers:[],events:[],eventIndex:0,penalty:0};const app=document.getElementById('app');
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const points=()=>Math.max(0,state.answers.reduce((a,b)=>a+(b?.points||0),0)+state.events.reduce((a,b)=>a+(b?.points||0),0)-state.penalty);
const button=(o,i,chosen,disabled)=>`<button class="option ${chosen===i?'chosen':''}" data-choice="${i}" ${disabled?'disabled':''}><span class="choice-label">${'ABC'[i]}.</span> ${o[0]}</button>`;
function stopClock(){if(clock){clearInterval(clock);clock=null}}
function startClock(key){if(currentKey===key&&clock)return;stopClock();currentKey=key;deadline=Date.now()+timeLimit*1000;clock=setInterval(()=>{let remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=document.getElementById('timer-count'),bar=document.getElementById('timer-bar');if(el){el.textContent=remain+' сек';el.className='timertext'+(remain<=10?' warning':'')}if(bar)bar.style.width=(remain/timeLimit*100)+'%';if(remain===0){stopClock();commitChoice(-1)}},200)}
function commitChoice(i){const event=state.screen==='event',idx=event?state.eventIndex:state.index,existing=event?state.events[idx]:state.answers[idx];if(existing)return;stopClock();const opts=(event?events[idx]:missions[idx]).opts;const a={choice:i,points:i<0?0:opts[i][1]};if(event)state.events[idx]=a;else state.answers[idx]=a;
// An earlier reliance on personal control creates an operational vulnerability when the shift leader is absent.
if(event&&idx===0&&state.answers[0]?.choice!==2)state.penalty+=5;
if(event&&idx===1&&state.answers[2]?.choice!==1)state.penalty+=5;
render()}
function render(){stopClock();window.scrollTo(0,0);
if(state.screen==='welcome'){app.innerHTML=`<section class="hero"><div class="eyebrow">ECRU OPERATIONS · INTERACTIVE GAME</div><h1>SAVE THE<br><span class="spark">CHRISTMAS</span></h1><div class="ornaments">✦ 🎁 ✳</div>${mapMarkup()}<p>Четыре миссии. Два неожиданных события. 30 секунд на решение. Твои решения изменят судьбу праздничной смены.</p></section><section class="panel"><div class="smallcaps">4 МИССИИ · 2 СЮРПРИЗА · 30 СЕКУНД НА ОТВЕТ</div><h2>Готов принять вызов?</h2><p>Введи имя — и попробуй удержать магазин под контролем.</p><input id="name" class="input" maxlength="36" placeholder="Имя директора"><button class="btn" id="start">НАЧАТЬ ИГРУ →</button></section>`;document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim()||'Директор ECRU';state.screen='game';currentKey='';render()};return}
if(state.screen==='game'||state.screen==='event'){
const event=state.screen==='event',m=event?events[state.eventIndex]:missions[state.index],ans=event?state.events[state.eventIndex]:state.answers[state.index],opts=m.opts;const key=(event?'e':'m')+(event?state.eventIndex:state.index);
app.innerHTML=`<div class="progress">${missions.map((_,i)=>`<span class="${i<=state.index?'on':''}"></span>`).join('')}</div><div class="mission">${event?'НЕОЖИДАННОЕ СОБЫТИЕ':`МИССИЯ ${m.label}`}</div><h2>${event?m.headline:m.title}</h2>${mapMarkup()}<section class="panel"><div class="smallcaps">${event?'СЮЖЕТНЫЙ ПОВОРОТ':'СИТУАЦИЯ В МАГАЗИНЕ'}</div><div class="scenario">${event?m.desc:m.scene}</div><h3>${m.q}</h3>${!ans?`<div class="timertext" id="timer-count">30 сек</div><div class="timerwrap"><div class="timerbar" id="timer-bar"></div></div>`:""}${opts.map((o,i)=>button(o,i,ans?.choice,!!ans)).join('')}${ans?`<div class="feedback"><strong>${ans.choice<0?'Время вышло — 0 баллов':'+'+ans.points+' баллов'}</strong><div style="margin-top:7px">${ans.choice<0?'Решение не принято вовремя. Управляемый процесс должен работать даже в условиях дефицита времени.':opts[ans.choice][2]}</div></div>${event&&((state.eventIndex===0&&state.answers[0]?.choice!==2)||(state.eventIndex===1&&state.answers[2]?.choice!==1))?'<div class="consequence">⚠️ Последствие предыдущего решения: команда не получила устойчивый процесс. Дополнительный штраф −5 баллов.</div>':''}<button class="btn" id="next">${event?'ПРОДОЛЖИТЬ →':state.index===3?'УЗНАТЬ РЕЗУЛЬТАТ →':'ДАЛЬШЕ →'}</button>`:''}</section><p class="muted">Баллы: ${points()} / 100 · Решения нельзя отменить</p>`;
document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>commitChoice(Number(el.dataset.choice)));if(!ans)startClock(key);
if(ans)document.getElementById('next').onclick=()=>{if(event){state.screen='game';state.index=state.eventIndex===0?1:3}else if(state.index===0||state.index===2){state.eventIndex=state.index===0?0:1;state.screen='event'}else if(state.index===3){state.screen='result'}else state.index++;render()};return}
const score=points(),rank=score>=85?'АРХИТЕКТОР ПРОЦЕССОВ':score>=60?'ОРГАНИЗАТОР':'АНТИКРИЗИСНЫЙ МЕНЕДЖЕР';app.innerHTML=`<section class="hero"><div class="eyebrow">MISSION COMPLETE ✦</div><h1>${score>=65?'НОВЫЙ ГОД':'МИССИЯ'}<br><span class="spark">${score>=65?'СПАСЁН!':'ЗАВЕРШЕНА!'}</span></h1></section>${mapMarkup()}<section class="panel"><div class="smallcaps">РЕЗУЛЬТАТ УЧАСТНИКА</div><h2>${safe(state.name)}</h2><div class="score">${score}<span style="font-size:22px;color:#668573"> / 100</span></div><h2>${rank}</h2><p>${score>=85?'Ты создал устойчивую систему, способную справляться даже с неожиданностями.':score>=65?'Ты уверенно управляешь процессами. Подумай, какие решения ещё зависят от личного контроля.':'Неожиданности показали, почему разовые решения уступают описанным процессам.'}</p><div class="smallcaps">ТВОЙ ПУТЬ</div>${missions.map((m,i)=>`<div class="stat"><span>${m.label.split('/')[1].trim()}</span><strong>${state.answers[i]?.points||0} / 20</strong></div>`).join('')}<div class="stat"><span>Неожиданные события</span><strong>${state.events.reduce((s,a)=>s+(a?.points||0),0)} / 20</strong></div><div class="stat"><span>Последствия прошлых решений</span><strong>−${state.penalty}</strong></div><p><strong>Главный вывод:</strong> если процесс можно описать, передать команде и проверить — он выдерживает даже неожиданные изменения.</p><button class="btn" id="copy">СКОПИРОВАТЬ РЕЗУЛЬТАТ</button><button class="btn secondary" id="again">ПРОЙТИ ЗАНОВО</button></section>`;
document.getElementById('again').onclick=()=>{state={screen:'welcome',name:'',index:0,answers:[],events:[],eventIndex:0,penalty:0};currentKey='';render()};document.getElementById('copy').onclick=async()=>{let t=`ECRU SAVE THE CHRISTMAS\n${state.name}\n${score}/100 — ${rank}`;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='СКОПИРОВАНО ✓'}catch(e){window.prompt('Скопируй результат:',t)}}}
render();
</script></body></html>
